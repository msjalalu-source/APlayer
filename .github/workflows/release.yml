name: Build Release APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get taglib from the original author
        run: |
          git config submodule.third-party/taglib.url https://github.com/rRemix/taglib.git
          git submodule update --init --recursive || true
          if [ -z "$(ls -A third-party/taglib 2>/dev/null)" ]; then
            rm -rf third-party/taglib
            git clone --recursive https://github.com/rRemix/taglib.git third-party/taglib
          fi

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Prepare signing
        run: |
          cat > local.properties <<EOF
          keystore.storeFile=${GITHUB_WORKSPACE}/app/Debug.jks
          keystore.storePassword=123456
          keystore.keyAlias=Debug
          keystore.keyPassword=123456
          EOF

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleFossRelease

      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          gh release create latest app/build/outputs/apk/foss/release/*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "APlayer latest build" \
            --notes "Automatic release build from commit $GITHUB_SHA"
